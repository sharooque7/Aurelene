spring:
  security:
    user:
      name: ${SECURITY_USERNAME:admin}
      password: ${SECURITY_PASSWORD:12345}
  application:
    name: ${SPRING_APP_NAME:user-management-service}
  datasource:
    url: jdbc:postgresql://localhost:5434/user_management?options=-c%20TimeZone=Asia/Kolkata
    username: ainzson
    password: ainzson123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
  level:
    root: INFO
    com.ainzson.usermanagementservice: DEBUG
    org:
      springframework:
        security: ${SPRING_SECURITY_LOG_LEVEL:TRACE}







